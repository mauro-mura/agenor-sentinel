spring:
  application:
    name: sentinel-alerter
  main:
    banner-mode: off
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/sentinel}
    username: ${JDBC_USERNAME:sentinel}
    password: ${JDBC_PASSWORD:sentinel}
    hikari:
      maximum-pool-size: 6
  # @friction F2: the probes share this database, and their Agenor directory migrations may run
  # first. Boot's Flyway then finds a non-empty schema with no history table of its own and refuses
  # to start, although spring-boot-starter.md says it needs no setting. The baseline must be below
  # V1, or V1 would be marked as applied and skipped (adapters/jdbc-directory.md).
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

agenor:
  runtime:
    name: sentinel-alerter
  messaging:
    provider: redis
    redis:
      uri: ${REDIS_URI:redis://localhost:6379}
      consumer-group-prefix: sentinel
  directory:
    provider: jdbc
    jdbc:
      url: ${JDBC_URL:jdbc:postgresql://localhost:5432/sentinel}
      username: ${JDBC_USERNAME:sentinel}
      password: ${JDBC_PASSWORD:sentinel}
      pool-size: 4
    presence: jdbc
    heartbeat-interval: 15s

sentinel:
  webhook-url: ${WEBHOOK_URL:http://localhost:8090/webhook}
